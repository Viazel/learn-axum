[package]
name = "learn-axum"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1" # Nécessaire pour extraire le body dans les tests
